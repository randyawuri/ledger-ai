[project]
name = "backend"
version = "0.1.0"
description = "Ledger AI Backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic[email]",
    "pydantic-settings>=2.11.0",
    "pwdlib[argon2]",
    "python-jose[cryptography]",
    "pyjwt",
    "email-validator",
    "python-multipart",
    "openai",
    "celery",
    "redis",
    "faker",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "sqlalchemy-orm>=1.2.10",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
